<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempo para surpresa</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background-color: #052B4F;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .container {
        max-width: 900px;
        padding: 20px;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 30px;
        letter-spacing: 2px;
    }

    .timer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-bottom: 40px;
    }

    .box {
        border: 1px solid #fff;
        padding: 15px 20px;
        min-width: 110px;
    }

    .number {
        font-size: 2rem;
        font-weight: bold;
    }

    .label {
        font-size: 0.9rem;
        margin-top: 5px;
        opacity: 0.8;
    }

    button {
        background-color: #fff;
        color: #052B4F;
        border: none;
        padding: 15px 30px;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #ccc;
    }
</style>
</head>

<body>
<div class="container">
    <h1>Tempo pra sua surpresa</h1>

    <div class="timer">
        <div class="box">
            <div class="number" id="months">0</div>
            <div class="label">Meses</div>
        </div>
        <div class="box">
            <div class="number" id="weeks">0</div>
            <div class="label">Semanas</div>
        </div>
        <div class="box">
            <div class="number" id="days">0</div>
            <div class="label">Dias</div>
        </div>
        <div class="box">
            <div class="number" id="hours">0</div>
            <div class="label">Horas</div>
        </div>
        <div class="box">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutos</div>
        </div>
        <div class="box">
            <div class="number" id="seconds">0</div>
            <div class="label">Segundos</div>
        </div>
    </div>

    <br>

    <button onclick="window.location.href='https://share.google/4XyHIU7j7I3n0KRcx'">
        Joguinho
    </button>
</div>

<script>
function atualizarTimer() {
    const agora = new Date();
    const alvo = new Date("2027-11-13T00:00:00");

    let diff = alvo - agora;
    if (diff <= 0) return;

    const segundos = Math.floor(diff / 1000);
    const minutos = Math.floor(segundos / 60);
    const horas = Math.floor(minutos / 60);
    const dias = Math.floor(horas / 24);
    const semanas = Math.floor(dias / 7);
    const meses = Math.floor(dias / 30);

    document.getElementById("months").innerText = meses;
    document.getElementById("weeks").innerText = semanas;
    document.getElementById("days").innerText = dias;
    document.getElementById("hours").innerText = horas % 24;
    document.getElementById("minutes").innerText = minutos % 60;
    document.getElementById("seconds").innerText = segundos % 60;
}

setInterval(atualizarTimer, 1000);
atualizarTimer();
</script>

</body>
  </html>
