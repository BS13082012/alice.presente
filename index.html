<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espero que você goste do presente</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background-color: #052B4F;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .container {
        max-width: 900px;
        padding: 20px;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 30px;
        letter-spacing: 2px;
    }

    .timer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-bottom: 40px;
    }

    .box {
        border: 1px solid #fff;
        padding: 15px 20px;
        min-width: 110px;
    }

    .number {
        font-size: 2rem;
        font-weight: bold;
    }

    .label {
        font-size: 0.9rem;
        margin-top: 5px;
        opacity: 0.8;
    }

    button {
        background-color: #fff;
        color: #052B4F;
        border: none;
        padding: 15px 30px;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #ccc;
    }
</style>
</head>

<body>
<div class="container">
    <h1></h1>

    <button onclick="window.location.href='https://share.google/gGaWd3sPLpWiQsQBq'">
